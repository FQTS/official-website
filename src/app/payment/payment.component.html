<section class="payment-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-6 m-auto">
        <div class="form-wrapper mb-5">
          <form [formGroup]="form" class="p-4 position-relative">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="name" class="form-label text-start d-block"
                    >Name</label
                  >
                  <input
                    type="text"
                    id="name"
                    class="form-control"
                    formControlName="name"
                    placeholder="Enter Name"
                  />
                  <div
                    *ngIf="
                      form.get('name')?.invalid &&
                      (form.get('name')?.dirty || form.get('name')?.touched)
                    "
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="form.get('name')?.hasError('required')">
                      Name is required.
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="email" class="form-label text-start d-block"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    formControlName="email"
                    placeholder="info@example.com"
                  />
                  <div
                    *ngIf="
                      form.get('email')?.invalid &&
                      (form.get('email')?.dirty || form.get('email')?.touched)
                    "
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="form.get('email')?.hasError('required')">
                      Please enter email address
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="phone" class="form-label text-start d-block"
                    >Mobile</label
                  >
                  <input
                    type="text"
                    id="phone"
                    class="form-control"
                    formControlName="mobile"
                    placeholder="Enter mobile number"
                  />
                  <div
                    *ngIf="
                      form.get('mobile')?.invalid &&
                      (form.get('mobile')?.dirty || form.get('mobile')?.touched)
                    "
                    class="invalid-feedback d-block"
                  >
                    <div *ngIf="form.get('mobile')?.hasError('required')">
                      Please enter mobile number
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="address" class="form-label text-start d-block"
                    >Address</label
                  >
                  <input
                    type="text"
                    id="address"
                    class="form-control"
                    formControlName="address"
                    placeholder="Enter address"
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="city" class="form-label text-start d-block"
                    >City</label
                  >
                  <input
                    type="text"
                    id="city"
                    class="form-control"
                    formControlName="city"
                    placeholder="Enter city"
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="state" class="form-label text-start d-block"
                    >State</label
                  >
                  <input
                    type="text"
                    id="state"
                    class="form-control"
                    formControlName="state"
                    placeholder="Enter state"
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="zip_code" class="form-label text-start d-block"
                    >Zip Code</label
                  >
                  <input
                    type="text"
                    id="zip_code"
                    class="form-control"
                    formControlName="zip_code"
                    placeholder="Enter zip code"
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="country" class="form-label text-start d-block"
                    >Country</label
                  >
                  <input
                    type="text"
                    id="country"
                    class="form-control"
                    formControlName="country"
                    placeholder="Enter country"
                  />
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label
                    for="company_name"
                    class="form-label text-start d-block"
                    >Company Name</label
                  >
                  <input
                    type="text"
                    id="company_name"
                    class="form-control"
                    formControlName="company_name"
                    placeholder="Enter company name"
                  />
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="service" class="form-label text-start d-block"
                    >Service
                  </label>
                  <select
                    id="service"
                    class="form-select"
                    formControlName="service"
                    placeholder="Select service"
                  >
                    <option selected>Select Service...</option>
                    <option
                      *ngFor="let list of servicesList"
                      [value]="list.value"
                    >
                      {{ list.label }}
                    </option>
                  </select>
                  <div
                    *ngIf="
                      form.get('serviceRequired')?.invalid &&
                      (form.get('serviceRequired')?.dirty ||
                        form.get('serviceRequired')?.touched)
                    "
                    class="invalid-feedback d-block"
                  >
                    <div
                      *ngIf="form.get('serviceRequired')?.hasError('required')"
                    >
                      Please select service
                    </div>
                  </div>
                </div>
              </div>
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">SUBMIT</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
