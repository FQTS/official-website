<app-banner></app-banner>
<section class="section-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <app-section-title titlePreffix="Working Everytime" titleSuffix="For Your Needs"
          titleAlign="center"></app-section-title>
      </div>
      <div class="col-md-4 my-3" *ngFor="let need of yourNeeds; let i = index">
        <app-card-component [icon]="need.icon" [cardTitle]="need.cardTitle" [cardDescription]="need.cardDescription"
          [index]="i + 1"></app-card-component>
      </div>
    </div>
  </div>
</section>

<section class="section-wrapper our-services">
  <div class="container position-relative">
    <div class="row">
      <div class="col-md-12 mb-5">
        <app-section-title titlePreffix="Our" titleSuffix="Services" titleAlign="center"
          prefixColor="white"></app-section-title>
      </div>
      <div class="col-md-3 mb-5" *ngFor="let service of ourServices">
        <div class="service-box text-center">
          <div class="icon text-primary fs-1">
            <i class="bi bi-{{ service.icon }}"></i>
          </div>
          <h3 class="card-title text-white fs-3 my-3">
            {{ service.name }}
          </h3>
          <p class="text-accent">{{ service.description }}</p>
          <a href="javascript:void(0)" [routerLink]="service.routePath">Read More</a>
        </div>
      </div>
    </div>
  </div>
</section>
<section class="section-wrapper">
  <div class="container position-relative">
    <div class="row">
      <div class="col-md-12 mb-5">
        <app-section-title titlePreffix="Trusted clients" titleSuffix="we work with."
          titleAlign="center"></app-section-title>
      </div>
      <div class="col-md-12">
        <owl-carousel-o [options]="customOptions">
          <ng-template carouselSlide>
            <a href="https://pladainfotech.com/" target="_blank">
              <div class="client-slider">

                <img src="../../assets/images/plada-logo-1.png" alt="Plada Info Tech" />

              </div>
            </a>
          </ng-template>
          <ng-template carouselSlide>
            <a href="https://www.ivaniconsultancy.com/" target="_blank">
              <div class="client-slider">
                <img src="../../assets/images/ivani.png" alt="Plada Info Tech" />
              </div>
            </a>
          </ng-template>
          <ng-template carouselSlide>
            <div class="client-slider">
              <img src="../../assets/images/soho-stays.png" alt="Plada Info Tech" />
            </div>
          </ng-template>
          <ng-template carouselSlide>
            <div class="client-slider">
              <img src="../../assets/images/e-vidhyut.png" alt="Plada Info Tech" />
            </div>
          </ng-template>
          <ng-template carouselSlide>
            <a href="https://sanjeevaninews.com/" target="_blank">
              <div class="client-slider">
                <img src="../../assets/images/sanjivani-1.png" alt="Plada Info Tech" />
              </div>
            </a>
          </ng-template>
        </owl-carousel-o>
      </div>
    </div>
  </div>
</section>

<section class="section-wrapper bg-primary" id="enquiry">
  <div class="container position-relative">
    <div class="row">
      <div class="col-md-6">
        <div class="my-5 rounded-5 bg-white h-50">
          <iframe class="rounded-5"
            src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d1891.1376605916314!2d73.78289872155686!3d18.561622240085956!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bffa19aff7af%3A0x4c25b72ae1b7b9d6!2sFirst%20Quad%20Tech%20Solutions!5e0!3m2!1sen!2sin!4v1712607415011!5m2!1sen!2sin"
            width="100%" height="100%" style="border: 0" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div>
          <div class="d-flex align-items-center justify-content-center  flex-column ">
              <p class=" text-center text-white">Office No. 12, 2nd Floor, Suyash Shroff Commercial Mall, Survey No. 74, above Union Bank Of India, near Balewadi Phata, Baner, Pune, Maharashtra 411045</p>
              <ul class="p-0 d-flex justify-content-center text-white">
                  <li class="social-icon text-white me-3">
                      <a target="_blank" href="https://www.instagram.com" class="text-white"><i class="bi bi-instagram fs-3"></i></a>
                  </li>
                  <li class="social-icon text-white me-3">
                      <a target="_blank" href="https://www.facebook.com" class="text-white"><i class="bi bi-facebook fs-3"></i></a>
                  </li>
                  <li class="social-icon text-white  me-3">
                      <a target="_blank" href="https://www.linkedin.com/in/first-quad-tech-solutions-740441301" class="text-white"><i class="bi bi-linkedin fs-3"></i></a>
                  </li>
              </ul>
          </div>
      </div>


      </div>
      <div class="col-md-6">
        <div class="m-5 rounded-5 bg-white">
          <form [formGroup]="form" class=" p-4 position-relative ">
            <div class="row px-5">
              <app-section-title titlePreffix="Contact" prefixColor="black"></app-section-title>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="name" class="form-label text-start d-block">Name</label>
                  <input type="text" id="name" class="form-control  " formControlName="name" placeholder="Name">
                </div>

                <div class="form-group  mb-3">
                  <label for="name" class="form-label text-start d-block">Email</label>
                  <input type="email" id="email" class="form-control" formControlName="email" placeholder="Email">
                </div>

              </div>
              <div class="col-md-6">

                <div class="form-group mb-3">
                  <label for="phone" class="form-label text-start d-block">Mobile</label>
                  <input type="text" id="phone" class="form-control" formControlName="mobile" placeholder="Mobile">
                </div>

                <div class="form-group mb-3">
                  <label for="service" class="form-label text-start d-block">Service Required</label>
                  <select id="service" class="form-select" formControlName="serviceRequired">
                    <option *ngFor="let service of serviceTypes" [value]="service.id">{{ service.name }}</option>
                  </select>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="message" class="form-label text-start d-block">Tell Us More...</label>
                  <textarea id="message" class="form-control" formControlName="message" rows="4"
                    placeholder="A Brief Summary of Your Project"></textarea>
                </div>
              </div>
              <div class="d-grid  mb-3">
                <button type="submit" class="btn btn-primary " (click)="Clientenquiry()">
                  SUBMIT
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
